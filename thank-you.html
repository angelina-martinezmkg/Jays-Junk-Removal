<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request received | Junk Removal</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Manrope:wght@500;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:1.5rem;background:#121314;color:#fff;font-family:Manrope,system-ui,sans-serif;text-align:center}
    main{max-width:640px;display:grid;justify-items:center;gap:1.2rem}
    .ico{width:84px;height:84px;border-radius:50%;background:#c6f432;color:#121314;display:grid;place-items:center;font-size:2.4rem;font-weight:800}
    h1{margin:0;font-family:"Big Shoulders Display",Impact,sans-serif;font-weight:900;text-transform:uppercase;font-size:clamp(3rem,10vw,5.4rem);line-height:.88}
    h1 span{color:#c6f432}
    p{margin:0;color:#a09e97;font-size:1.1rem;line-height:1.6}
    p b{color:#fff}
    .row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center;margin-top:.6rem}
    a.btn{display:inline-flex;align-items:center;min-height:3.4rem;padding:0 1.6rem;border-radius:999px;background:#c6f432;color:#121314;font-weight:800;letter-spacing:.06em;text-transform:uppercase;font-size:.92rem;text-decoration:none}
    a:focus-visible{outline:3px solid #c6f432;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <span class="ico" aria-hidden="true">&#10003;</span>
    <h1>Request <span>received.</span></h1>
    <p>Thanks! We received your appointment request. <b>It isn't confirmed yet.</b> We'll contact you to confirm the date, time and details.</p>
    <div class="row">
      <a class="btn" href="/">Back to home</a>
    </div>
  </main>
</body>
</html>
